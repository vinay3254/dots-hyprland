# Font configuration
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Window styling & padding
window_padding_width 12 14
confirm_os_window_close 0
background_opacity 0.95
dynamic_background_opacity yes

# Pure Black OLED Color Palette
background #000000
foreground #ECEFF4

cursor #00E5FF
cursor_text_color #000000
cursor_shape beam
cursor_trail 1

selection_foreground #000000
selection_background #00E5FF

# Standard ANSI Colors
color0 #1A1A1A
color1 #FF5555
color2 #50FA7B
color3 #F1FA8C
color4 #BD93F9
color5 #FF79C6
color6 #8BE9FD
color7 #BFBFBF

# Bright Colors
color8 #4D4D4D
color9 #FF6E6E
color10 #69FF94
color11 #FFFFA5
color12 #D6ACFF
color13 #FF92DF
color14 #A4FFFF
color15 #FFFFFF

# Keybindings
map ctrl+c       copy_or_interrupt
map ctrl+v       paste_from_clipboard
map ctrl+equal   change_font_size all +1
map ctrl+minus   change_font_size all -1
map ctrl+0       change_font_size all 0
