# Kitty Terminal Configuration - Apple macOS Design Language

# 1. Typography & Optical Sizing
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
adjust_line_height 120%

# 2. Window Geometry & Margins
window_padding_width 16 20
confirm_os_window_close 0
background_opacity 0.90
dynamic_background_opacity yes
hide_window_decorations yes
window_border_width 0

# 3. macOS Physical Cursor Dynamics
cursor #0A84FF
cursor_text_color #000000
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
cursor_trail 3
cursor_trail_decay 0.1 0.3

# 4. Selection (macOS Highlight Blue)
selection_foreground #FFFFFF
selection_background #004880

# 5. Safari / macOS Tab Bar Styling
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template " {title} "
active_tab_foreground #FFFFFF
active_tab_background #1C1C1E
active_tab_font_style bold
inactive_tab_foreground #8E8E93
inactive_tab_background #000000
tab_bar_background #000000

# 6. Apple System Dark Palette
background #000000
foreground #F5F5F7

# Standard ANSI Colors
color0  #1C1C1E
color1  #FF453A
color2  #30D158
color3  #FFD60A
color4  #0A84FF
color5  #BF5AF2
color6  #64D2FF
color7  #E5E5EA

# Bright Colors (Apple High-Contrast)
color8  #48484A
color9  #FF6961
color10 #34C759
color11 #FFCC00
color12 #409CFF
color13 #DA8FFF
color14 #70D7FF
color15 #FFFFFF

# 7. Keybindings
map ctrl+shift+c copy_to_clipboard
map ctrl+c       copy_or_interrupt
map ctrl+shift+v paste_from_clipboard
map ctrl+v       paste_from_clipboard
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+equal   change_font_size all +1
map ctrl+minus   change_font_size all -1
map ctrl+0       change_font_size all 0
