# Hyprlock Configuration - Apple Design Language
source = ~/.config/hypr/hyprlock/colors.conf

background {
    monitor =
    path = $background_image
    color = rgba(0, 0, 0, 0.9)
    blur_passes = 3
    blur_size = 10
    noise = 0.015
    contrast = 0.92
    brightness = 0.85
    vibrancy = 0.5
    vibrancy_darkness = 0.1
}

# 1. Clock (Large, Bold Typography)
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.95)
    font_size = 76
    font_family = Inter, JetBrainsMono Nerd Font, -apple-system, sans-serif
    position = 0, 190
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.6)
}

# 2. Date (Optical Tracking)
label {
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = rgba(255, 255, 255, 0.75)
    font_size = 16
    font_family = Inter, JetBrainsMono Nerd Font, -apple-system, sans-serif
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}

# 3. User Name & Avatar
label {
    monitor =
    text =   $USER
    color = rgba(255, 255, 255, 0.85)
    font_size = 16
    font_family = Inter, JetBrainsMono Nerd Font, -apple-system, sans-serif
    position = 0, 30
    halign = center
    valign = center
}

# 4. Password Input Capsule (Frosted Translucent Pill)
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.15)
    inner_color = rgba(15, 15, 15, 0.75)
    font_color = rgba(255, 255, 255, 0.95)
    check_color = rgba(0, 229, 255, 0.8)
    fail_color = rgba(255, 51, 102, 0.8)
    fade_on_empty = false
    rounding = 24
    placeholder_text = <span foreground="##777777">Enter Password</span>
    hide_input = false

    position = 0, -35
    halign = center
    valign = center
}

# 5. Caps Lock Warning
label {
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = rgba(255, 184, 0, 0.9)
    font_size = 12
    font_family = Inter, JetBrainsMono Nerd Font, sans-serif
    position = 0, -85
    halign = center
    valign = center
}

# 6. Battery & Status Pill
label {
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = rgba(255, 255, 255, 0.6)
    font_size = 13
    font_family = JetBrainsMono Nerd Font, monospace
    position = 30, -30
    halign = left
    valign = top
}

# 7. Keyboard Layout Pill
label {
    monitor =
    text = $LAYOUT
    color = rgba(255, 255, 255, 0.6)
    font_size = 13
    font_family = JetBrainsMono Nerd Font, monospace
    position = -30, -30
    halign = right
    valign = top
}
