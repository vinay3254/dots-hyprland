# macOS Big Sur/Sonoma Layout & Theme Configuration for Hyprland

# 1. Window Geometry & Decoration
general {
    gaps_in = 6
    gaps_out = 10
    border_size = 0
    resize_on_border = true
}

decoration {
    rounding = 10
    rounding_power = 2.0

    # macOS Heavy Vibrancy Blur (24px+)
    blur {
        enabled = true
        size = 12
        passes = 3
        xray = true
        contrast = 0.95
        brightness = 0.95
        vibrancy = 0.70
    }

    # Soft ambient drop shadow on focused window only
    shadow {
        enabled = true
        range = 28
        render_power = 4
        offset = 0, 6
        color = rgba(0, 0, 0, 0.35)
    }
}

# 2. Layer Rules (Frosted Blur on Bar, Dock, Spotlight, and Notification Center)
layerrule = blur, waybar
layerrule = ignorealpha 0.2, waybar
layerrule = blur, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = blur, rofi
layerrule = blur, nwg-dock
layerrule = ignorealpha 0.1, nwg-dock
layerrule = blur, quickshell:.*
layerrule = ignorealpha 0.2, quickshell:.*

# 3. macOS Keybindings
bind = SUPER, SPACE, exec, pkill rofi || rofi -show drun -config ~/.config/rofi/spotlight-dark.rasi || pkill fuzzel || fuzzel
bind = SUPER, N, exec, swaync-client -t -sw || qs -c ii ipc call sidebarRight toggle
bind = SUPER, TAB, exec, qs -c ii ipc call overview toggle
