animations {
    enabled = yes

    # Apple-style physical spring curves with subtle overshoot
    bezier = appleSpring, 0.34, 1.56, 0.64, 1.0
    bezier = appleEase, 0.05, 0.90, 0.10, 1.0
    bezier = appleSnappy, 0.20, 0.0, 0.0, 1.0

    # Windows
    animation = windowsIn, 1, 4.2, appleSpring, popin 92%
    animation = windowsOut, 1, 3.2, appleSnappy, popin 95%
    animation = windowsMove, 1, 3.8, appleSpring, slide

    # Layers / Menus (Rofi, Swaync, Wlogout)
    animation = layersIn, 1, 3.5, appleSpring, popin 94%
    animation = layersOut, 1, 2.8, appleSnappy, popin 96%
    animation = fadeLayersIn, 1, 3.0, appleEase
    animation = fadeLayersOut, 1, 2.5, appleSnappy

    # Workspaces (Spaces inertia swipe)
    animation = workspaces, 1, 4.8, appleSpring, slide
    animation = specialWorkspace, 1, 4.0, appleSpring, slidevert
}
