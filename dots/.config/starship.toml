# Starship Prompt — Apple macOS Pro Developer Edition
# Clean, minimal, optical hierarchy with zero clutter

add_newline = false
format = """$directory$git_branch$git_status$package$cmd_duration$line_break$character"""

# Directory (macOS style clean folder path)
[directory]
style = "bold #409CFF"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 󰌾"
read_only_style = "red"

# Git Branch
[git_branch]
style = "bold #30D158"
symbol = "󰘬 "
format = "on [$symbol$branch]($style) "

# Git Status
[git_status]
style = "#FFD60A"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "🏳 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕ "
untracked = "? "
stashed = "📦 "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "✘ "

# Command Execution Duration
[cmd_duration]
min_time = 2_000
style = "dimmed #8E8E93"
format = "took [$duration]($style) "

# Minimal macOS Prompt Character
[character]
success_symbol = "[❯](bold #0A84FF)"
error_symbol = "[❯](bold #FF453A)"
vimcmd_symbol = "[❮](bold #30D158)"

[package]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[golang]
disabled = true
